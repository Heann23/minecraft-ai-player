# PR 과 main 에 올라온 소스가 저장소의 파일만으로 빌드되고 단위 테스트를 통과하는지 확인한다.
# 서버 시나리오는 테스트 서버가 필요해서 여기서 돌리지 않는다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # pluginsDir 를 비워서 배포 단계(deployPlugin)가 돌지 않게 한다. build 는 단위 테스트까지 돈다.
      - name: Build and test
        run: bash ./gradlew build "-PpluginsDir=" --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
