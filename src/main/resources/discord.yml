# Discord 설정만 관리한다. config.yml의 게임 설정과 독립적이다.
# 실제 접속에는 봇 토큰과 설치한 로컬 STT·Ollama·Piper 서버가 필요하다.
# 서버 JVM 옵션: --enable-native-access=ALL-UNNAMED (Java 25 DAVE/Opus).
enabled: false
# 봇 토큰을 아래 token 에 그대로 붙여 넣는다. 이 파일을 다른 사람에게 보내거나 공개 저장소에 올리지 않는다.
token: ''
# token 이 비어 있으면 이 이름의 환경 변수에서 읽는다 (파일에 적고 싶지 않을 때).
token-env: MINECRAFTAI_DISCORD_TOKEN
# Discord ID는 숫자가 아니라 따옴표로 감싼 문자열로 쓴다.
guild-id: ''
voice-channel-id: ''
character-id: herry
auto-connect: true

game:
  # 선택 기능: 대화에서 상태를 읽을 게임 AI 이름. /ai status에 표시된 이름을 정확히 지정한다.
  # 빈 값이면 게임 상태를 공유하지 않는다. character-id/Discord 이름으로 대상을 추측하지 않는다.
  # 대화는 최근 상태만 읽으며 게임 행동을 시키지 않는다.
  target-ai: ''

audio:
  # RMS 에너지를 사용한 초기 잡음 구분. 음성 인식 신뢰도가 아니며 실제 마이크로 조정한다.
  minimum-rms: 0.01
  # 발화 종료까지 기다리는 무음 시간. 짧은 문장 사이에서 호출어가 잘리는 것을 줄인다.
  # 길게 늘리면 응답 시작도 늦어진다. 실제 마이크로 100~2500ms 범위에서 조정한다.
  end-silence-millis: 1000

conversation:
  # 해리는 음성 채널의 말만 듣는다. Discord에 글로 쓰는 대화는 받지 않는다.
  # 내 이름·말투·장난 설정과 기억 삭제는 음성만으로 할 수 있다. 장난 중단·존댓말 요청은 바로 저장하고,
  # 이름·반말 허락·장난 허용·기억 삭제는 해리가 되물은 뒤 같은 사람이 "네"라고 답해야 적용한다.
  # /herry me는 모델을 호출하지 않고 본인이 확정한 이름·말투·장난 설정만 개인 회신으로 보여 준다.
  # 명령으로도 가능: /herry name, /herry speech allowed:true|false, /herry joke allowed:true|false, /herry forget.
  # 인용문·타인 설명·모델의 응답이나 대상 없는 "응/네", "반말해도 돼요?" 같은 질문으로 설정을 추측하지 않는다.
  # 새 참가자에게 대화·음성 인식이 멈춘 뒤 짧게 인사한다. 잦은 재입장은 반복하지 않는다.
  greet-on-join: true
  followup-seconds: 60
  context-lines: 32

backup:
  enabled: true
  interval-seconds: 600
  periodic-retention: 24
  daily-retention: 7
  max-megabytes: 128

# 로컬 Ollama 제공자 연결 설정. 모델 설치·봇 접속은 아직 별도 단계다.
# 설치한 한국어 대화 모델 이름을 지정하며 자동 다운로드하지 않는다.
providers:
  llm:
    # Ollama 0.35.1 이상: 문맥의 자동 잘라내기/교체를 금지하고 초과 시 오래된 대화만 제한적으로 줄인다.
    # 재시도 전체가 timeout-seconds 안에서 끝나며 질문·말투/장난 설정·유효한 게임 자료는 유지한다.
    endpoint: 'http://127.0.0.1:11434/api/chat'
    model: ''
    timeout-seconds: 15
    context-tokens: 4096
    output-tokens: 160
  stt:
    endpoint: 'http://127.0.0.1:8080/inference'
    timeout-seconds: 15
  tts:
    endpoint: 'http://127.0.0.1:5000/synthesize'
    # 설치한 한국어 Piper 음성 이름. 비워 두면 로컬 서버가 선택한 음성 사용.
    voice: ''
    timeout-seconds: 10
